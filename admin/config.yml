backend:
  name: turbo-github
  repo: "SottoMonte/colosso"
  turbo_site_id: "05f7d746-f4f4-4d88-a073-92226e46dd0d"
  branch: main

locale: it
publish_mode: simple
media_folder: uploads
public_folder: /uploads

collections:
  - name: impostazioni
    label: Impostazioni sito
    files:
      - name: azienda
        label: Azienda e contatti
        file: data/site.json
        fields:
          - { label: Nome attività, name: brand, widget: string }
          - { label: Frase introduttiva, name: tagline, widget: string }
          - { label: Presentazione, name: intro, widget: text }
          - { label: Nota sui contatti, name: contact_note, widget: string, required: false }
          - { label: Zona o modalità di assistenza, name: coverage, widget: string, required: false }
          - { label: Indirizzo pubblico, name: address, widget: string, required: false }
          - { label: Telefono, name: phone, widget: string, required: false }
          - label: Numero WhatsApp
            name: whatsapp
            widget: string
            required: false
            hint: Inserisci il numero completo con prefisso internazionale, solo cifre.
          - { label: Email di contatto, name: email, widget: string, required: false }
          - label: Configurazione EmailJS
            name: emailjs
            widget: object
            required: false
            fields:
              - { label: ID servizio, name: service_id, widget: string, required: false }
              - { label: ID template, name: template_id, widget: string, required: false }
              - { label: Chiave pubblica, name: public_key, widget: string, required: false }
          - label: Dati dell'impresa
            name: legal
            widget: object
            fields:
              - { label: Titolare o denominazione, name: holder, widget: string, required: false }
              - { label: Forma giuridica, name: legal_form, widget: string, required: false }
              - { label: Sede legale, name: registered_office, widget: string, required: false }
              - { label: Partita IVA, name: vat_number, widget: string, required: false }
              - { label: Numero REA, name: rea, widget: string, required: false }

  - name: catalogo
    label: Servizi e pacchetti
    files:
      - name: servizi
        label: Offerte Colosso
        file: data/services.json
        fields:
          - label: Servizi e pacchetti
            name: services
            widget: list
            label_singular: offerta
            fields:
              - label: ID univoco
                name: id
                widget: string
                hint: Breve, univoco e senza spazi; per esempio riparazione-smartphone-tablet.
              - { label: Nome servizio o pacchetto, name: name, widget: string }
              - label: Categoria
                name: category
                widget: select
                options:
                  - Riparazioni
                  - Servizi digitali
                  - Automazioni
                  - Marketing
                  - Abbonamenti
              - label: Tipologia
                name: kind
                widget: select
                options:
                  - Intervento tecnico
                  - Progetto
                  - Servizio continuativo
                  - Pacchetto in abbonamento
              - { label: Formula o modalità, name: format, widget: string }
              - label: Prezzo in euro
                name: price
                widget: number
                value_type: float
                min: 0
                step: 0.01
                required: false
                hint: Tariffa indicativa di partenza; il sito la mostra con "Da". Lascia vuoto per le offerte da preventivare.
              - label: Periodo del prezzo
                name: price_period
                widget: select
                options:
                  - una tantum
                  - mensile
                  - annuale
                default: una tantum
                required: false
              - { label: Descrizione, name: description, widget: text, required: false }
              - { label: Immagine, name: image, widget: image, required: false }
              - label: Aspetti del servizio
                name: specifications
                widget: list
                required: false
                label_singular: dettaglio
                fields:
                  - { label: Aspetto, name: label, widget: string }
                  - { label: Valore, name: value, widget: string }
              - label: Campi aggiuntivi nel carrello
                name: order_fields
                widget: list
                required: false
                label_singular: campo
                hint: Ogni quantità del servizio avrà un gruppo di campi separato nel carrello.
                fields:
                  - label: Nome interno
                    name: name
                    widget: string
                    hint: Usa lettere, numeri, trattini o underscore senza spazi; deve essere univoco per questo servizio.
                  - { label: Etichetta nel carrello, name: label, widget: string }
                  - label: Tipo di campo
                    name: type
                    widget: select
                    options:
                      - text
                      - textarea
                      - email
                      - tel
                      - number
                      - select
                    default: text
                  - label: Opzioni del menu (solo per select)
                    name: options
                    widget: list
                    required: false
                    field: { label: Opzione, name: option, widget: string }
                  - { label: Testo guida, name: placeholder, widget: string, required: false }
                  - { label: Campo obbligatorio, name: required, widget: boolean, default: false, required: false }
              - { label: Mostra in home, name: featured, widget: boolean, default: false }
              - { label: Disponibile, name: available, widget: boolean, default: true }
